<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Screen</title>
  <style>
    /* =========================================================
       COLOR THEME & VARIABLES
       ========================================================= */
    html {
      /* Theme Base Colors */
      --page-bg: #f2f4f7;          
      --card-bg: #ffffff;          
      --card-border: #e2e8f0;      
      
      /* Typography Colors */
      --text-main: #0f172a;        
      --text-sub: #64748b;         
      --text-muted: #94a3b8;       
      
      /* Payment Option Box Theme */
      --option-bg: #ffffff;        
      --option-border: #e2e8f0;    
      --option-selected-bg: #f8fafc;
      --option-selected-border: #0f172a;
      
      /* QR Code Section Theme */
      --qr-bg: #fafafa;            
      --qr-border: #cbd5e1;        

      /* Button Theme */
      --btn-bg: #0f172a;           
      --btn-text: #ffffff;         
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--page-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Outer Device Container */
    .device-container {
      width: 360px;
      background-color: var(--card-bg);
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--card-border);
      overflow: hidden;
      padding: 20px 18px;
    }

    /* Top Bar Clock */
    .top-bar {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    /* Screen Title */
    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 10px;
    }

    /* Payment List Options with Custom Radio Buttons */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--option-border);
      border-radius: 12px;
      padding: 12px 14px;
      background-color: var(--option-bg);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Radio button interaction style */
    .option-item input[type="radio"] {
      accent-color: #0f172a;
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin-right: 10px;
    }

    .option-item:has(input[type="radio"]:checked) {
      border-color: var(--option-selected-border);
      background-color: var(--option-selected-bg);
    }

    .option-left {
      display: flex;
      align-items: center;
    }

    /* Payment Method Icon Container */
    .option-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 10px;
    }

    .option-text h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .option-text p {
      font-size: 11px;
      color: var(--text-sub);
    }

    .chevron {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 16px;
    }

    /* QR Code Section */
    .qr-card {
      border: 1.5px dashed var(--qr-border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      background-color: var(--qr-bg);
      margin-bottom: 18px;
    }

    .qr-heading {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 10px;
    }

    .qr-image-wrapper {
      background-color: #ffffff;
      width: 120px;
      height: 120px;
      margin: 0 auto 12px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-image-wrapper img {
      width: 100%;
      height: 100%;
    }

    /* Brand SVG Logos Row with Text */
    .brand-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #ffffff;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    .logo-item span {
      font-size: 10px;
      font-weight: 700;
      color: #334155;
    }

    .logo-item svg {
      height: 16px;
      width: auto;
    }

    /* Order Summary Breakdown */
    .summary-box {
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      margin-bottom: 16px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #475569;
      margin-bottom: 6px;
    }

    .summary-line.total-line {
      font-weight: 700;
      color: var(--text-main);
      font-size: 14px;
      border-top: 1px dashed var(--qr-border);
      padding-top: 8px;
      margin-top: 8px;
    }

    /* Pay Now CTA */
    .btn-pay {
      width: 100%;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .security-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="device-container">
    <!-- Top Clock -->
    <div class="top-bar">9:41</div>

    <!-- Title -->
    <h1 class="page-title">Payment</h1>

    <!-- Payment Options List with Radio Selectors -->
    <div class="section-label">Choose Payment Method</div>
    <div class="options-list">
      
      <!-- Option 1: UPI -->
      <label class="option-item">
        <div class="option-left">
          <input type="radio" name="payment_method" value="upi" checked>
          <div class="option-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f259f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <path d="M12 12h.01"/>
              <path d="M16 12h.01"/>
              <path d="M8 12h.01"/>
            </svg>
          </div>
          <div class="option-text">
            <h4>UPI</h4>
            <p>Google Pay, PhonePe, Paytm, BHIM</p>
          </div>
        </div>
        <div class="chevron">&gt;</div>
      </label>

      <!-- Option 2: Cards -->
      <label class="option-item">
        <div class="option-left">
          <input type="radio" name="payment_method" value="card">
          <div class="option-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
              <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
          </div>
          <div class="option-text">
            <h4>Credit/Debit Card</h4>
            <p>Visa, Mastercard, RuPay</p>
          </div>
        </div>
        <div class="chevron">&gt;</div>
      </label>

      <!-- Option 3: Wallet -->
      <label class="option-item">
        <div class="option-left">
          <input type="radio" name="payment_method" value="wallet">
          <div class="option-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
              <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
              <path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>
            </svg>
          </div>
          <div class="option-text">
            <h4>Wallet</h4>
            <p>Amazon Pay, Paytm Wallet</p>
          </div>
        </div>
        <div class="chevron">&gt;</div>
      </label>

      <!-- Option 4: QR Code Payment -->
      <label class="option-item">
        <div class="option-left">
          <input type="radio" name="payment_method" value="qr">
          <div class="option-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
          </div>
          <div class="option-text">
            <h4>QR Code Payment</h4>
            <p>Scan & Pay with any UPI app</p>
          </div>
        </div>
        <div class="chevron">&gt;</div>
      </label>

    </div>

    <!-- QR Scan Section with App Logos and Text Labels -->
    <div class="qr-card">
      <div class="qr-heading">Scan QR to Pay</div>
      <div class="qr-image-wrapper">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Payment" alt="Scan QR Code">
      </div>
      
      <!-- Brand Logos and App Text -->
      <div class="brand-logos">
        <!-- GPay -->
        <div class="logo-item">
          <svg viewBox="0 0 100 40">
            <text x="0" y="28" font-size="28" font-family="Arial, sans-serif" font-weight="bold" fill="#4285F4">G</text>
            <text x="24" y="28" font-size="22" font-family="'Segoe UI', sans-serif" font-weight="bold" fill="#EA4335">पे</text>
          </svg>
          <span>Google Pay</span>
        </div>

        <!-- PhonePe -->
        <div class="logo-item">
          <svg viewBox="0 0 32 32">
            <rect width="32" height="32" rx="16" fill="#5f259f"/>
            <path d="M19.5 8.5H14.8c-0.5 0-0.9 0.4-0.9 0.9v13.2c0 0.5 0.4 0.9 0.9 0.9h1.9c0.5 0 0.9-0.4 0.9-0.9v-4.1h1.9c3.2 0 5.4-2.1 5.4-5 0-2.9-2.2-5-5.4-5zm0 6.1h-1.9v-2.7h1.9c1.2 0 2 0.7 2 1.3 0 0.7-0.8 1.4-2 1.4z" fill="#ffffff"/>
          </svg>
          <span>PhonePe</span>
        </div>

        <!-- Paytm -->
        <div class="logo-item">
          <svg viewBox="0 0 80 25">
            <text x="0" y="20" font-weight="900" font-size="22" font-family="Arial, sans-serif" fill="#002E6E">Pay</text>
            <text x="42" y="20" font-weight="900" font-size="22" font-family="Arial, sans-serif" fill="#00BAF2">tm</text>
          </svg>
          <span>Paytm</span>
        </div>

        <!-- BHIM -->
        <div class="logo-item">
          <svg viewBox="0 0 60 25">
            <text x="0" y="20" font-weight="bold" font-size="20" font-family="Arial, sans-serif" fill="#0078D4">BHIM</text>
          </svg>
          <span>BHIM</span>
        </div>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="summary-box">
      <div class="section-label">Order Summary</div>
      <div class="summary-line">
        <span>Rental (2 days)</span>
        <span>₹500</span>
      </div>
      <div class="summary-line">
        <span>Deposit</span>
        <span>₹500</span>
      </div>
      <div class="summary-line total-line">
        <span>Total</span>
        <span>₹800</span>
      </div>
    </div>

    <!-- Action Button -->
    <button class="btn-pay">Pay Now</button>
    <div class="security-note">
      🔒 Secure Payment 100% Safe
    </div>
  </div>

</body>
</html>
